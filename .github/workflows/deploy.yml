name: Deploy to cPanel

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Deploy via lftp
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" <<EOF
          debug 1
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set ftp:fix-pasv-address yes
          set ftp:use-feat no
          set ftp:use-mlsd no
          set net:timeout 45
          set net:max-retries 20
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 90
          set net:reconnect-interval-multiplier 1.5
          set mirror:use-pget-n 1
          set mirror:parallel-directories yes
          set cmd:fail-exit yes
          mirror --reverse --verbose --parallel=1 --continue --exclude .htpasswd --exclude images/ ./dist/ ./public_html/
          mirror --reverse --verbose --parallel=1 --continue ./dist/images/ ./public_html/images/
          bye
          EOF
