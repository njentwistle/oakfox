name: Build and push to deploy branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Write .cpanel.yml into dist
        run: |
          cat > dist/.cpanel.yml << 'YAML'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/oakfoxco/public_html/
              - /usr/bin/rsync -av --delete --exclude='.git' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='dashboard/.htpasswd' . $DEPLOYPATH
              - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} \;
              - /bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} \;
          YAML

      - name: Push dist to deploy branch (linear history, fast-forwardable)
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Try to clone the existing deploy branch; if it doesn't exist yet, init a fresh orphan.
          if git clone --depth=1 --branch=deploy --single-branch "$REMOTE" deploy-clone 2>/dev/null; then
            echo "Cloned existing deploy branch"
          else
            echo "deploy branch missing — initialising fresh"
            mkdir deploy-clone
            cd deploy-clone
            git init -q
            git checkout --orphan deploy
            git remote add origin "$REMOTE"
            cd ..
          fi

          cd deploy-clone
          git config user.name  "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"

          # Wipe everything except .git, then drop in the new dist contents.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a ../dist/. .

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -q -m "Deploy ${{ github.sha }}"
          git push origin deploy

      # Optional: auto-trigger cPanel deploy via UAPI.
      # Uncomment and add CPANEL_TOKEN secret + cPanel host URL to enable.
      #
      # - name: Trigger cPanel deployment
      #   run: |
      #     curl -fsS -X POST \
      #       -H "Authorization: cpanel oakfoxco:${{ secrets.CPANEL_TOKEN }}" \
      #       "https://oakfox.co.uk:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome%2Foakfoxco%2Frepositories%2Foakfox"
