name: Deploy to cPanel

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Deploy via SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          # Tar, upload, and extract on server
          cd dist
          tar czf /tmp/deploy.tar.gz .
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/deploy.tar.gz \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/deploy.tar.gz

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "set -e; \
             echo '[deploy] home:' && pwd && \
             echo '[deploy] ls public_html before:' && ls -la ~/public_html | head -20 && \
             echo '[deploy] extracting...' && \
             cd ~/public_html && tar xzvf /tmp/deploy.tar.gz | tail -5 && \
             echo '[deploy] post-extract check:' && \
             ls -la ~/public_html/robots.txt ~/public_html/favicon-32.png ~/public_html/index.html && \
             rm /tmp/deploy.tar.gz && \
             echo '[deploy] done'"
