name: Build and push to deploy branch

on:
  push:
    branches: [main]
  # Daily rebuild so date-scheduled blog posts go live on their go-live date
  # without a manual push. The blog readers hide any post whose `date` is in the
  # future (see src/lib/posts.ts), so a queued post only enters the build — and
  # therefore the sitemap, RSS and IndexNow ping — once a build runs on/after
  # that date. 07:00 UTC clears midnight-UTC post dates with margin for GitHub's
  # scheduler lag.
  schedule:
    - cron: '0 7 * * *'
  # Manual "publish now" button in the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the IndexNow step can diff the pushed commit range
          # (github.event.before..sha) to find which pages actually changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Download ffmpeg.wasm assets into dist/vendor/ffmpeg
        # Self-host these so the dashboard reels renderer can spawn the worker
        # same-origin (Worker constructor blocks cross-origin scripts and
        # cross-origin importScripts is unreliable across browser/host combos).
        run: |
          mkdir -p dist/vendor/ffmpeg
          BASE_FFMPEG="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd"
          BASE_UTIL="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd"
          BASE_CORE="https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd"
          curl -fsSL "$BASE_FFMPEG/ffmpeg.js"        -o dist/vendor/ffmpeg/ffmpeg.js
          curl -fsSL "$BASE_FFMPEG/814.ffmpeg.js"    -o dist/vendor/ffmpeg/814.ffmpeg.js
          curl -fsSL "$BASE_UTIL/index.js"           -o dist/vendor/ffmpeg/util.js
          curl -fsSL "$BASE_CORE/ffmpeg-core.js"     -o dist/vendor/ffmpeg/ffmpeg-core.js
          curl -fsSL "$BASE_CORE/ffmpeg-core.wasm"   -o dist/vendor/ffmpeg/ffmpeg-core.wasm
          ls -la dist/vendor/ffmpeg

      - name: Copy .cpanel.yml and deploy.sh into dist
        run: |
          cp .cpanel.yml dist/.cpanel.yml
          cp deploy.sh dist/deploy.sh
          chmod +x dist/deploy.sh
          echo '--- .cpanel.yml contents ---'
          cat -A dist/.cpanel.yml

      - name: Push dist to deploy branch (linear history, fast-forwardable)
        id: deploy
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Try to clone the existing deploy branch; if it doesn't exist yet, init a fresh orphan.
          if git clone --depth=1 --branch=deploy --single-branch "$REMOTE" deploy-clone 2>/dev/null; then
            echo "Cloned existing deploy branch"
          else
            echo "deploy branch missing — initialising fresh"
            mkdir deploy-clone
            cd deploy-clone
            git init -q
            git checkout --orphan deploy
            git remote add origin "$REMOTE"
            cd ..
          fi

          cd deploy-clone
          git config user.name  "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"

          # Wipe everything except .git, then drop in the new dist contents.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a ../dist/. .

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -q -m "Deploy ${{ github.sha }}"
          git push origin deploy
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow for changed pages (push)
        # On a push, submit only the pages whose source changed in this commit
        # range (intersected with the live sitemap, so drafts/future posts are
        # excluded). Static site = a deploy IS the publish event. Fire-and-forget:
        # the script never throws, so a failed ping can't fail the deploy.
        if: github.event_name == 'push'
        run: node scripts/indexnow.mjs --changed ${{ github.event.before }} ${{ github.sha }}

      - name: Ping IndexNow for newly-published posts (scheduled)
        # On the daily cron / manual run there is no source commit range to diff,
        # so only act when the build actually changed the deploy output — that
        # only happens on the day a queued post crosses its go-live date. Then
        # resubmit the full live sitemap so the freshly-revealed URL is picked up.
        if: github.event_name != 'push' && steps.deploy.outputs.changed == 'true'
        run: node scripts/indexnow.mjs --all

      # Deploy to cPanel is intentionally MANUAL. Auto-triggering the cPanel git
      # pull/deploy (UAPI, FTP, and SSH were all tried — see git history) proved
      # unreliable on this shared host, which kept blocking the calls. So the cron
      # and pushes only build and push the freshly-built dist to the `deploy`
      # branch; publishing it live is a manual "Update from Remote" +
      # "Deploy HEAD Commit" in cPanel's Git Version Control UI.
      #
      # For a queued post: on its go-live date the daily cron rebuilds and pushes
      # the now-live post to the deploy branch automatically — you just do the one
      # manual cPanel deploy to push it to public_html.
